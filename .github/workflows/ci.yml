name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Run ShellCheck
        run: shellcheck h-agent install.sh test/h-agent-test test/install-test

      - name: Run tests
        run: make test
